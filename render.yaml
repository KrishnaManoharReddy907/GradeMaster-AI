# Render Blueprint: API (Docker web service) + frontend (static site).
# Secrets marked `sync: false` are entered in the Render dashboard, never committed.
# Database: MongoDB Atlas (set MONGO_URI). See docs/DEPLOYMENT.md.
services:
  - type: web
    name: grademaster-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: grademaster
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        generateValue: true    # needed once on /setup to create the first admin
      - key: CORS_ORIGINS
        sync: false            # the frontend URL, e.g. https://grademaster-web.onrender.com
      - key: TRUSTED_PROXY_HOPS
        value: "1"             # Render's proxy appends the client IP to X-Forwarded-For
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: LLM_PROVIDER
        value: gemini
      - key: GOOGLE_VISION_API_KEY
        sync: false            # optional; Gemini vision is the fallback
      - key: JUDGE0_API_URL
        value: https://ce.judge0.com
      - key: MAX_UPLOAD_MB
        value: "20"

  - type: web
    name: grademaster-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false            # the API URL, e.g. https://grademaster-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
